syntax = "proto3";

package orders.v1;

option java_multiple_files = true;
option java_package = "org.example.pr9.grpc";
option java_outer_classname = "OrderProto";

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_CREATED = 1;
  ORDER_STATUS_PROCESSING = 2;
  ORDER_STATUS_SHIPPED = 3;
  ORDER_STATUS_DELIVERED = 4;
  ORDER_STATUS_CANCELLED = 5;
}

message OrderItem {
  string product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  double unit_price = 4;
}

message GetOrderRequest {
  string order_id = 1;
}

message OrderResponse {
  string order_id = 1;
  string customer_id = 2;
  repeated OrderItem items = 3;
  double total_amount = 4;
  OrderStatus status = 5;
  string delivery_address = 6;
  string created_at = 7;
}

message ListOrdersRequest {
  string customer_id = 1;
}

message CreateOrderRequest {
  string customer_id = 1;
  repeated OrderItem items = 2;
  string delivery_address = 3;
}

message BulkOrderSummary {
  int32 total_orders = 1;
  double total_revenue = 2;
  repeated string created_order_ids = 3;
  string summary_message = 4;
}

message TrackOrderRequest {
  string order_id = 1;
}

message OrderStatusUpdate {
  string order_id = 1;
  OrderStatus status = 2;
  string status_description = 3;
  string timestamp = 4;
}

service OrderService {
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
  rpc ListOrdersByCustomer(ListOrdersRequest) returns (stream OrderResponse);
  rpc CreateBulkOrders(stream CreateOrderRequest) returns (BulkOrderSummary);
  rpc TrackOrders(stream TrackOrderRequest) returns (stream OrderStatusUpdate);
}
